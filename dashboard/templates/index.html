<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelAI — Lab Safety Agent</title>

<!-- MQTT.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>

<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header>
  <h1>🧪 SentinelAI — Lab Safety Agent</h1>
  <div id="conn-status" class="conn offline">● offline</div>
</header>

<!-- ── LIVE AGENT STATE ─────────────────────────────── -->
<section id="live-card" class="card level-green">
  <div class="live-header">
    <div class="level-badge" id="level-badge">GREEN</div>
    <div class="hazard" id="hazard">SAFE</div>
  </div>

  <div class="metrics">
    <div class="metric">
      <span class="label">Risk</span>
      <div class="bar"><div class="fill" id="risk-fill"></div></div>
      <span class="value" id="risk-value">0</span>
    </div>
    <div class="metric">
      <span class="label">Confidence</span>
      <span class="value" id="conf-value">0.00</span>
    </div>
    <div class="metric">
      <span class="label">Last update</span>
      <span class="value" id="ts-value">—</span>
    </div>
  </div>

  <div class="beliefs">
    <div class="belief"><span>SAFE</span><div class="bbar"><i id="b-safe"></i></div><b id="b-safe-v">0.00</b></div>
    <div class="belief"><span>GAS</span><div class="bbar"><i id="b-gas"></i></div><b id="b-gas-v">0.00</b></div>
    <div class="belief"><span>HEAT</span><div class="bbar"><i id="b-heat"></i></div><b id="b-heat-v">0.00</b></div>
    <div class="belief"><span>FIRE</span><div class="bbar"><i id="b-fire"></i></div><b id="b-fire-v">0.00</b></div>
  </div>

  <div class="rules">
    <span class="label">Rules fired</span>
    <div id="rules-list" class="chips">—</div>
  </div>
</section>

<!-- ── SENSOR READOUTS ─────────────────────────────── -->
<section id="sensors" class="card">
  <div class="live-header">
    <div class="hazard" style="font-size:1rem; color:#94a3b8; letter-spacing:.05em;">
      RAW SENSOR READINGS
    </div>
  </div>
  <div class="readout">
    <div><span class="label">Temperature</span><span class="value" id="s-temp">—</span></div>
    <div><span class="label">Humidity</span><span class="value" id="s-hum">—</span></div>
    <div><span class="label">MQ-2 (gas)</span><span class="value" id="s-mq2">—</span></div>
    <div><span class="label">MQ-135 (air)</span><span class="value" id="s-mq135">—</span></div>
    <div><span class="label">Flame</span><span class="value" id="s-flame">—</span></div>
    <div><span class="label">Occupied</span><span class="value" id="s-pir">—</span></div>
    <div><span class="label">Current</span><span class="value" id="s-current">—</span></div>
  </div>
</section>

<!-- ── DEVICES / ACTUATORS ──────────────────────────── -->
<section id="devices"></section>

<!-- ── EVENT HISTORY ────────────────────────────────── -->
<h2>Recent events</h2>
<table id="events">
  <thead>
    <tr>
      <th>Time</th><th>Device</th><th>Hazard</th>
      <th>Risk</th><th>Band</th><th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="static/script.js"></script>
</body>
</html>
